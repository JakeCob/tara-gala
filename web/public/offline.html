<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#167856">
<title>Tara Gala · offline</title>
<!-- Served by the service worker when a page wasn't saved (TG-27). Self-contained: no scripts, no other files. -->
<style>
  /* The pixel theme's palette, inline: a standalone page can't read the app's tokens (TG-42 ux.md 4.3) */
  body {
    margin: 0;
    min-height: 100vh;
    padding: 0 1rem;
    box-sizing: border-box;
    background: #cfe8c4;
    color: #1d2a24;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    box-sizing: border-box;
    max-width: 28rem;
    margin: 2rem auto;
    padding: 1.5rem;
    background: #fbf7ee;
    border: 3px solid #1d2a24;
    outline: 3px solid #1d2a24;
    outline-offset: -9px;
  }
  h1 { color: #167856; font-size: 1.5rem; font-weight: 800; margin: 0 0 0.75rem; }
  p { margin: 0 0 1.5rem; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 1rem;
    border: 3px solid #1d2a24;
    border-radius: 0;
    box-shadow: 0 3px 0 #1d2a24;
    background: #167856;
    color: #fbf7ee;
    font-weight: 700;
    text-decoration: none;
  }
  a:focus-visible { outline: 3px solid #1d2a24; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #121815; color: #fbf7ee; }
    main { background: #1b2420; border-color: #cfe8c4; outline-color: #cfe8c4; }
    h1 { color: #5fb36b; }
    a { background: #5fb36b; color: #1d2a24; border-color: #cfe8c4; box-shadow: 0 3px 0 #cfe8c4; }
    a:focus-visible { outline-color: #ffd65c; }
  }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page wasn't saved on this phone yet. Open it once while you have signal and it'll work offline next time.</p>
  <a href="/">Back to bus search</a>
</main>
</body>
</html>
